mode: external
fullnameOverride: grid-bootstrap
# Use the public ODH build for the SNO lab installation. The RHOAI payload
# image in registry.redhat.io requires separate stage-registry credentials.
image:
  repository: ghcr.io/praxis-proxy/grid-enrollment
  tag: v0.3.0-rc.4
  digest: ""
gridIdentity:
  enabled: true
ca:
  bootstrap:
    resources:
      requests:
        cpu: 100m
        memory: 128Mi
      limits:
        cpu: 500m
        memory: 256Mi
grid:
  membership:
    source: Local
managedClusters:
  enabled: true
  networkName: grid
  clusterSet: global
  clusterLabel: ai-grid/enabled
  clusterLabelValue: 'true'
  # The rhoai hub manifests own the shared binding.
  createClusterSetBinding: false
  hubClusterName: local-cluster
external:
  delivery:
    namespace: redhat-ai-grid
  certManager:
    enabled: true
    issuer:
      create: true
      name: grid-ca
    ca:
      # On a combined hub, the RHOAI enrollment service owns CA creation.
      # This chart reuses its grid-ca-key; the dedicated-hub profile overrides
      # this to Generate because no RHOAI enrollment service runs there.
      mode: Existing
