mode: external
fullnameOverride: grid-bootstrap
# The payload's enrollment image, matching apps/rhoai/values.yaml.
image:
  repository: registry.redhat.io/rhoai/odh-praxis-ai-grid-enrollment-rhel9
  digest: sha256:f61ed291932dc8cca9b64bf637b9590068d816658bbf73ef2098246ac6968cb6
gridIdentity:
  enabled: true
ca:
  bootstrap:
    resources:
      requests:
        cpu: 100m
        memory: 128Mi
      limits:
        cpu: 500m
        memory: 256Mi
grid:
  membership:
    source: Local
managedClusters:
  enabled: true
  networkName: grid
  clusterSet: global
  clusterLabel: ai-grid/enabled
  clusterLabelValue: 'true'
  # The rhoai hub manifests own the shared binding.
  createClusterSetBinding: false
  hubClusterName: local-cluster
external:
  delivery:
    namespace: redhat-ai-grid
  certManager:
    enabled: true
    issuer:
      create: true
      name: grid-ca
    ca:
      # On a combined hub, the RHOAI enrollment service owns CA creation.
      # This chart reuses its grid-ca-key; the dedicated-hub profile overrides
      # this to Generate because no RHOAI enrollment service runs there.
      mode: Existing
