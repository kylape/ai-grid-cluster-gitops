# -- Managed cluster name. Set per cluster by the acm-submariner ApplicationSet.
clusterName: ""
# -- Namespace where the Submariner operator is installed.
installNamespace: submariner-operator
# -- Default to a LoadBalancer Service for cloud sites. The ApplicationSet
# turns this off for ManagedClusters labelled ai-grid/submariner-private-network=true.
loadBalancerEnable: true
# -- Default gateway count for redundant cloud sites. The ApplicationSet uses
# one gateway for private-network lab sites with a single worker.
gateways: 2
