apiVersion: argoproj.io/v1alpha1
kind: ApplicationSet
metadata:
  name: acm-submariner
  namespace: openshift-gitops
  annotations:
    # Request the Submariner add-on before the wave-2 Broker resource, whose CRD
    # is supplied by that add-on on the hub.
    argocd.argoproj.io/sync-wave: "1"
spec:
  goTemplate: true
  goTemplateOptions: ["missingkey=error"]
  generators:
    - clusters:
        selector:
          matchLabels:
            apps.open-cluster-management.io/acm-cluster: "true"
  template:
    metadata:
      name: 'acm-submariner-{{ .name }}'
      namespace: openshift-gitops
    spec:
      project: default
      source:
        repoURL: https://github.com/kylape/ai-grid-cluster-gitops.git
        targetRevision: hub-onboarding-sno-20261105
        path: apps/acm/submariner
        helm:
          releaseName: acm-submariner
          parameters:
            - name: clusterName
              value: '{{ .name }}'
            # LWE/HyperShift sites sharing a private host network can tunnel
            # directly between worker addresses. Keep that mode site-scoped;
            # cloud sites retain the LoadBalancer and two-gateway defaults.
            - name: loadBalancerEnable
              value: '{{ if eq (index .metadata.labels "ai-grid/submariner-private-network") "true" }}false{{ else }}true{{ end }}'
            - name: nattEnable
              value: '{{ if eq (index .metadata.labels "ai-grid/submariner-private-network") "true" }}false{{ else }}true{{ end }}'
            - name: forceUDPEncaps
              value: '{{ if eq (index .metadata.labels "ai-grid/submariner-private-network") "true" }}true{{ else }}false{{ end }}'
            - name: gateways
              value: '{{ if eq (index .metadata.labels "ai-grid/submariner-private-network") "true" }}1{{ else }}2{{ end }}'
      destination:
        server: https://kubernetes.default.svc
        namespace: open-cluster-management
      ignoreDifferences:
        - group: addon.open-cluster-management.io
          kind: ManagedClusterAddOn
          jsonPointers:
            - /metadata/finalizers
      syncPolicy:
        automated:
          prune: true
          selfHeal: true
        retry:
          limit: 10
          backoff:
            duration: 30s
            factor: 2
            maxDuration: 10m
        syncOptions:
          - CreateNamespace=true
          - SkipDryRunOnMissingResource=true
          - ServerSideApply=true
