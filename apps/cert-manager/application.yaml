apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  # Both combined and dedicated hubs need cert-manager for the grid-ca Issuer.
  # The selected root ApplicationSet discovers this Application from Git.
  name: cert-manager
  namespace: openshift-gitops
spec:
  project: default
  source:
    repoURL: https://github.com/ai-grid-cloud/ai-grid-cluster-gitops.git
    targetRevision: HEAD
    path: apps/cert-manager/manifests
  destination:
    server: https://kubernetes.default.svc
    namespace: cert-manager-operator
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    retry:
      limit: 10
      backoff:
        duration: 30s
        factor: 2
        maxDuration: 10m
    syncOptions:
      - CreateNamespace=true
